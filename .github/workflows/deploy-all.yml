name: deploy-all
on:
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  rollout:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { service: referral-api-gateway, port: 8080 }
          - { service: referral-auth-service, port: 8081 }
          - { service: referral-listing-service, port: 8082 }
          - { service: referral-claim-service, port: 8083 }
          - { service: referral-payment-service, port: 8084 }
          - { service: referral-user-service, port: 8085 }
          - { service: referral-admin-service, port: 8086 }
          - { service: referral-notification-service, port: 8087 }
          - { service: referral-support-service, port: 8088 }
          - { service: referral-analytics-service, port: 8089 }
          - { service: referral-audit-service, port: 8090 }
          - { service: referral-orchestration-service, port: 8091 }
          - { service: referral-ai-service, port: 8092 }
    uses: ./.github/workflows/service-cd.yml
    with:
      service: ${{ matrix.service }}
      port: ${{ matrix.port }}
      ref: main
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      OKE_CLUSTER_OCID: ${{ secrets.OKE_CLUSTER_OCID }}

  # One regression run after the whole fleet has rolled out (not per service).
  # Runs whether or not every leg succeeded so the dashboard records the
  # post-rollout state; never blocks the deploy.
  post-deploy-regression:
    needs: rollout
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Trigger referral-tests regression
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL || 'https://referral-frontend-ten.vercel.app' }}
        run: |
          set -euo pipefail
          gh workflow run regression.yml \
            --repo ghorha/referral-tests \
            -f base_url="${FRONTEND_BASE_URL}" \
            -f live_backend=true \
            -f record=true
          echo "Dispatched referral-tests regression against ${FRONTEND_BASE_URL}"
