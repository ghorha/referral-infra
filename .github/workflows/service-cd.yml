# Reusable CD workflow for Referral Java services (github.com/ghorha).
#
# Flow: build + test the service -> build & push its container image to the
# GitHub Container Registry (GHCR) as a linux/arm64 image -> `helm upgrade` it
# onto the OKE cluster.
#
# Why arm64: the OCI Always-Free compute is Ampere A1 (Arm), so the cluster
# nodes are arm64 and images must be built for that architecture.
#
# Registry: images live at ghcr.io/ghorha/<service> and are pushed with the
# built-in GITHUB_TOKEN (no separate registry credentials needed). This requires
# `permissions: packages: write` on both this workflow and the calling job.
#
# Image visibility: GHCR packages default to PRIVATE on first push. These images
# are pulled anonymously by the cluster (no imagePullSecret is configured), so
# the FIRST time a service's package is created you must make it PUBLIC once in
# the repo's Packages settings (Package settings -> Change visibility -> Public).
# After that, subsequent pushes stay public.
#
# Called by each service repo's .github/workflows/cd.yml on push to main, and by
# referral-infra's deploy-all.yml for full / first-time rollouts. Consumers must pass
# `secrets: inherit` and grant `packages: write` on the calling job.
#
# Required repository / organization secrets (OCI, for OKE access only):
#   OCI_CLI_USER         - OCID of the OCI user used for API-key auth
#   OCI_CLI_TENANCY      - OCID of the tenancy
#   OCI_CLI_FINGERPRINT  - Fingerprint of the API signing key
#   OCI_CLI_KEY_CONTENT  - PEM contents of the API signing private key
#   OCI_CLI_REGION       - OCI region identifier for the CLI (e.g. us-ashburn-1)
#   OKE_CLUSTER_OCID     - OCID of the target OKE cluster
# No OCIR secrets are needed anymore; GHCR auth uses the built-in GITHUB_TOKEN.
name: service-cd

on:
  workflow_call:
    inputs:
      service:
        description: Service name, also the image repo and values file stem (e.g. referral-auth-service)
        required: true
        type: string
      port:
        description: Container / service port for the service
        required: true
        type: number

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout service repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build and test
        run: gradle test bootJar --no-daemon

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (linux/arm64)
        # NOTE: the runner is amd64, so arm64 is cross-built through QEMU
        # emulation here, which is noticeably slower than a native build.
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/ghorha/${{ inputs.service }}:${{ github.sha }}
            ghcr.io/ghorha/${{ inputs.service }}:latest

      - name: Install and configure OCI CLI
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
        run: |
          curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh \
            | bash -s -- --accept-all-defaults
          echo "${HOME}/bin" >> "$GITHUB_PATH"
          mkdir -p "${HOME}/.oci"
          printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "${HOME}/.oci/oci_api_key.pem"
          chmod 600 "${HOME}/.oci/oci_api_key.pem"
          {
            echo "[DEFAULT]"
            echo "user=${OCI_CLI_USER}"
            echo "fingerprint=${OCI_CLI_FINGERPRINT}"
            echo "tenancy=${OCI_CLI_TENANCY}"
            echo "region=${OCI_CLI_REGION}"
            echo "key_file=${HOME}/.oci/oci_api_key.pem"
          } > "${HOME}/.oci/config"
          chmod 600 "${HOME}/.oci/config"

      - name: Configure kubeconfig for OKE
        env:
          OKE_CLUSTER_OCID: ${{ secrets.OKE_CLUSTER_OCID }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
        run: |
          mkdir -p "${HOME}/.kube"
          oci ce cluster create-kubeconfig \
            --cluster-id "$OKE_CLUSTER_OCID" \
            --region "$OCI_CLI_REGION" \
            --file "${HOME}/.kube/config" \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT

      - name: Checkout referral-infra (Helm chart + values)
        uses: actions/checkout@v4
        with:
          repository: ghorha/referral-infra
          ref: main
          path: infra

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm upgrade
        env:
          SERVICE: ${{ inputs.service }}
          PORT: ${{ inputs.port }}
          SHA: ${{ github.sha }}
        run: |
          helm upgrade --install "${SERVICE}" ./infra/deploy/chart \
            -n referral --create-namespace \
            -f "./infra/deploy/values/${SERVICE}.yaml" \
            --set image.registry=ghcr.io/ghorha \
            --set image.tag="${SHA}" \
            --set port="${PORT}" \
            --wait --timeout 5m
