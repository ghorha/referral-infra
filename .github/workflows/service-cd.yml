# Reusable CD for ghorha referral Java services.
# Prefer invoking via deploy-service.yml / deploy-all.yml on this repo so OCI
# secrets resolve from referral-infra (org secrets are unreliable across
# cross-repo workflow_call).
name: service-cd

on:
  workflow_call:
    inputs:
      service:
        description: Service repo / image name (e.g. referral-auth-service)
        required: true
        type: string
      port:
        description: Container / service port
        required: true
        type: number
      ref:
        description: Git ref/SHA of the service repo
        required: false
        type: string
        default: main
    secrets:
      GH_PAT:
        required: true
      OCI_CLI_USER:
        required: true
      OCI_CLI_TENANCY:
        required: true
      OCI_CLI_FINGERPRINT:
        required: true
      OCI_CLI_KEY_CONTENT:
        required: true
      OCI_CLI_REGION:
        required: true
      OKE_CLUSTER_OCID:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout service repo
        uses: actions/checkout@v4
        with:
          repository: ghorha/${{ inputs.service }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GH_PAT }}

      - name: Resolve image tag
        id: meta
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Building ${{ inputs.service }} @ ${SHA}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build bootJar
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew bootJar --no-daemon -x test
          else
            gradle bootJar --no-daemon -x test
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/ghorha/${{ inputs.service }}:${{ steps.meta.outputs.sha }}
            ghcr.io/ghorha/${{ inputs.service }}:latest

      - name: Configure kubeconfig for OKE
        env:
          OKE_CLUSTER_OCID: ${{ secrets.OKE_CLUSTER_OCID }}
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
        run: |
          set -euo pipefail
          for d in "${HOME}/bin" /opt/homebrew/bin /usr/local/bin; do
            echo "$d" >> "$GITHUB_PATH"
          done
          export PATH="${HOME}/bin:/opt/homebrew/bin:/usr/local/bin:${PATH}"
          if ! command -v oci >/dev/null 2>&1; then
            echo "::error::OCI CLI missing on runner (checked ~/bin, /opt/homebrew/bin, /usr/local/bin)."
            exit 1
          fi
          echo "Using oci at $(command -v oci)"

          CFG_DIR="${RUNNER_TEMP}/oci-ghorha"
          KUBECONFIG_PATH="${RUNNER_TEMP}/kubeconfig-ghorha"
          mkdir -p "$CFG_DIR"

          # Prefer explicit secrets from this workflow (infra repo) over shared ~/.oci profiles.
          test -n "${OCI_CLI_USER:-}" || { echo "::error::OCI_CLI_USER empty"; exit 1; }
          test -n "${OCI_CLI_TENANCY:-}" || { echo "::error::OCI_CLI_TENANCY empty"; exit 1; }
          test -n "${OCI_CLI_FINGERPRINT:-}" || { echo "::error::OCI_CLI_FINGERPRINT empty"; exit 1; }
          test -n "${OCI_CLI_KEY_CONTENT:-}" || { echo "::error::OCI_CLI_KEY_CONTENT empty"; exit 1; }
          test -n "${OCI_CLI_REGION:-}" || { echo "::error::OCI_CLI_REGION empty"; exit 1; }
          test -n "${OKE_CLUSTER_OCID:-}" || { echo "::error::OKE_CLUSTER_OCID empty"; exit 1; }

          printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "${CFG_DIR}/oci_api_key.pem"
          # Some secret stores omit the trailing marker line.
          if ! grep -q 'END .*PRIVATE KEY' "${CFG_DIR}/oci_api_key.pem"; then
            printf 'OCI_API_KEY\n' >> "${CFG_DIR}/oci_api_key.pem"
          fi
          chmod 600 "${CFG_DIR}/oci_api_key.pem"
          {
            echo "[DEFAULT]"
            echo "user=${OCI_CLI_USER}"
            echo "fingerprint=${OCI_CLI_FINGERPRINT}"
            echo "tenancy=${OCI_CLI_TENANCY}"
            echo "region=${OCI_CLI_REGION}"
            echo "key_file=${CFG_DIR}/oci_api_key.pem"
          } > "${CFG_DIR}/config"
          chmod 600 "${CFG_DIR}/config"
          export OCI_CLI_CONFIG_FILE="${CFG_DIR}/config"
          unset OCI_CLI_PROFILE || true

          oci ce cluster create-kubeconfig \
            --cluster-id "$OKE_CLUSTER_OCID" \
            --region "${OCI_CLI_REGION}" \
            --file "${KUBECONFIG_PATH}" \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT
          echo "KUBECONFIG=${KUBECONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Checkout referral-infra (Helm chart + values)
        uses: actions/checkout@v4
        with:
          repository: ghorha/referral-infra
          ref: main
          path: infra
          token: ${{ secrets.GH_PAT }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm upgrade
        env:
          SERVICE: ${{ inputs.service }}
          PORT: ${{ inputs.port }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/bin:/opt/homebrew/bin:/usr/local/bin:${PATH}"
          helm upgrade --install "${SERVICE}" ./infra/deploy/chart \
            -n referral --create-namespace \
            -f "./infra/deploy/values/${SERVICE}.yaml" \
            --set image.registry=ghcr.io/ghorha \
            --set image.tag="${SHA}" \
            --set port="${PORT}" \
            --set 'imagePullSecrets[0].name=ghcr-pull' \
            --force-conflicts \
            --wait --timeout 10m
