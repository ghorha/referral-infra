# Reusable CD for ghorha referral Java services.
#
# Callers: each service repo's own cd.yml now calls this directly with
# `secrets: inherit` (see e.g. referral-claim-service/.github/workflows/cd.yml).
# This works because GH_PAT/OCI_CLI_*/OKE_CLUSTER_OCID are organization-level
# secrets with visibility: all (verified via `gh api orgs/ghorha/actions/secrets`).
# An earlier attempt at this same pattern failed when those secrets were more
# narrowly scoped, which is why deploy-service.yml/deploy-all.yml (manual
# workflow_dispatch on this repo) exist as a fallback below — use them if
# `secrets: inherit` ever stops resolving secrets across a repo boundary again:
#   gh workflow run deploy-service.yml --repo ghorha/referral-infra \
#     -f service=<name> -f port=<port> -f ref=<sha-or-main>
name: service-cd

on:
  workflow_call:
    inputs:
      service:
        description: Service repo / image name (e.g. referral-auth-service)
        required: true
        type: string
      port:
        description: Container / service port
        required: true
        type: number
      ref:
        description: Git ref/SHA of the service repo
        required: false
        type: string
        default: main
    secrets:
      GH_PAT:
        required: true
      OCI_CLI_USER:
        required: true
      OCI_CLI_TENANCY:
        required: true
      OCI_CLI_FINGERPRINT:
        required: true
      OCI_CLI_KEY_CONTENT:
        required: true
      OCI_CLI_REGION:
        required: true
      OKE_CLUSTER_OCID:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: "build-and-deploy (${{ inputs.service }})"
    # GitHub-hosted runner (referral-infra has free Actions minutes). The former
    # self-hosted macOS runner was the deploy bottleneck: slow/wedge-prone arm64
    # Docker + it slept mid-rollout, timing out every deploy. ubuntu-latest is
    # fast and always-on; it builds the linux/arm64 image via QEMU (trivial now
    # that the Dockerfiles copy the pre-built jar instead of compiling in-image).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # Guard against polluted dispatcher input (e.g. shell chpwd "ls" noise).
          if [[ ! "$REF" =~ ^(main|[0-9a-f]{7,40})$ ]]; then
            echo "::error::Invalid service ref '$REF' (expected main or git sha)"
            exit 1
          fi

      - name: Checkout service repo
        uses: actions/checkout@v4
        with:
          repository: ghorha/${{ inputs.service }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GH_PAT }}

      - name: Resolve image tag
        id: meta
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Building ${{ inputs.service }} @ ${SHA}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build bootJar
        run: |
          # Always use the service repo's own wrapper (pins Gradle/JDK per
          # DEPLOYMENT.md's "CI using wrong Gradle" troubleshooting note) —
          # never fall back to a system `gradle` binary.
          if [ ! -x ./gradlew ]; then
            echo "::error::./gradlew missing or not executable in ${{ inputs.service }} — refusing to fall back to system gradle"
            exit 1
          fi
          ./gradlew bootJar --no-daemon -x test

      # Self-hosted Mac runners share one Docker daemon across parallel jobs.
      # Isolate DOCKER_CONFIG per job and never logout, or a sibling job's
      # post-step logout races mid-push (GHCR 403).
      - name: Log in to GHCR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-${{ inputs.service }}-${{ github.run_id }}-${{ github.run_attempt }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          USERNAME=$(curl -fsSL -H "Authorization: Bearer ${GH_PAT}" https://api.github.com/user | python3 -c 'import json,sys; print(json.load(sys.stdin)["login"])')
          echo "$GH_PAT" | docker login ghcr.io -u "$USERNAME" --password-stdin
          echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "$GITHUB_ENV"
          # Keep buildx from falling back to the shared ~/.docker config.
          echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "$GITHUB_PATH" || true

      - name: Set up QEMU (build linux/arm64 on an amd64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (linux/arm64)
        uses: docker/build-push-action@v6
        # If the Docker daemon wedges, this step can otherwise hang
        # indefinitely with no output. 15 minutes covers a real (if slow,
        # QEMU-emulated arm64) build; past that, the daemon likely needs a
        # restart on the runner host.
        timeout-minutes: 15
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/ghorha/${{ inputs.service }}:${{ steps.meta.outputs.sha }}
            ghcr.io/ghorha/${{ inputs.service }}:latest

      - name: Install OCI CLI (GitHub-hosted runner)
        run: |
          set -euo pipefail
          python3 -m pip install --user --upgrade oci-cli
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Configure kubeconfig for OKE
        env:
          OKE_CLUSTER_OCID: ${{ secrets.OKE_CLUSTER_OCID }}
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
        run: |
          set -euo pipefail
          for d in "${HOME}/bin" /opt/homebrew/bin /usr/local/bin; do
            echo "$d" >> "$GITHUB_PATH"
          done
          export PATH="${HOME}/bin:/opt/homebrew/bin:/usr/local/bin:${PATH}"
          if ! command -v oci >/dev/null 2>&1; then
            echo "::error::OCI CLI missing on runner (checked ~/bin, /opt/homebrew/bin, /usr/local/bin)."
            exit 1
          fi
          echo "Using oci at $(command -v oci)"

          CFG_DIR="${RUNNER_TEMP}/oci-ghorha"
          KUBECONFIG_PATH="${RUNNER_TEMP}/kubeconfig-ghorha"
          mkdir -p "$CFG_DIR"

          # Prefer explicit secrets from this workflow (infra repo) over shared ~/.oci profiles.
          test -n "${OCI_CLI_USER:-}" || { echo "::error::OCI_CLI_USER empty"; exit 1; }
          test -n "${OCI_CLI_TENANCY:-}" || { echo "::error::OCI_CLI_TENANCY empty"; exit 1; }
          test -n "${OCI_CLI_FINGERPRINT:-}" || { echo "::error::OCI_CLI_FINGERPRINT empty"; exit 1; }
          test -n "${OCI_CLI_KEY_CONTENT:-}" || { echo "::error::OCI_CLI_KEY_CONTENT empty"; exit 1; }
          test -n "${OCI_CLI_REGION:-}" || { echo "::error::OCI_CLI_REGION empty"; exit 1; }
          test -n "${OKE_CLUSTER_OCID:-}" || { echo "::error::OKE_CLUSTER_OCID empty"; exit 1; }

          printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "${CFG_DIR}/oci_api_key.pem"
          # Some secret stores omit the trailing marker line.
          if ! grep -q 'END .*PRIVATE KEY' "${CFG_DIR}/oci_api_key.pem"; then
            printf 'OCI_API_KEY\n' >> "${CFG_DIR}/oci_api_key.pem"
          fi
          chmod 600 "${CFG_DIR}/oci_api_key.pem"
          {
            echo "[DEFAULT]"
            echo "user=${OCI_CLI_USER}"
            echo "fingerprint=${OCI_CLI_FINGERPRINT}"
            echo "tenancy=${OCI_CLI_TENANCY}"
            echo "region=${OCI_CLI_REGION}"
            echo "key_file=${CFG_DIR}/oci_api_key.pem"
          } > "${CFG_DIR}/config"
          chmod 600 "${CFG_DIR}/config"
          export OCI_CLI_CONFIG_FILE="${CFG_DIR}/config"
          unset OCI_CLI_PROFILE || true

          oci ce cluster create-kubeconfig \
            --cluster-id "$OKE_CLUSTER_OCID" \
            --region "${OCI_CLI_REGION}" \
            --file "${KUBECONFIG_PATH}" \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT
          {
            echo "KUBECONFIG=${KUBECONFIG_PATH}"
            echo "OCI_CLI_CONFIG_FILE=${CFG_DIR}/config"
            echo "PATH=${HOME}/bin:/opt/homebrew/bin:/usr/local/bin:${PATH}"
          } >> "$GITHUB_ENV"

      - name: Checkout referral-infra (Helm chart + values)
        uses: actions/checkout@v4
        with:
          repository: ghorha/referral-infra
          ref: main
          path: infra
          token: ${{ secrets.GH_PAT }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm upgrade
        env:
          SERVICE: ${{ inputs.service }}
          PORT: ${{ inputs.port }}
          SHA: ${{ steps.meta.outputs.sha }}
          # OKE kubeconfigs use `exec: command: oci` — PATH must include Homebrew.
          OCI_CLI_CONFIG_FILE: ${{ runner.temp }}/oci-ghorha/config
        run: |
          set -euo pipefail
          export PATH="${HOME}/bin:/opt/homebrew/bin:/usr/local/bin:${PATH}"
          if [ -z "${KUBECONFIG:-}" ] || [ ! -f "${KUBECONFIG}" ]; then
            echo "::error::KUBECONFIG missing from prior step"
            exit 1
          fi
          command -v oci >/dev/null
          command -v helm >/dev/null
          # Prove cluster auth works before helm (surfaces exec-plugin PATH issues early).
          kubectl --kubeconfig="${KUBECONFIG}" get ns referral >/dev/null
          helm upgrade --install "${SERVICE}" ./infra/deploy/chart \
            -n referral --create-namespace \
            -f "./infra/deploy/values/${SERVICE}.yaml" \
            --kubeconfig "${KUBECONFIG}" \
            --set image.registry=ghcr.io/ghorha \
            --set image.tag="${SHA}" \
            --set port="${PORT}" \
            --set 'imagePullSecrets[0].name=ghcr-pull' \
            --wait --timeout 10m
