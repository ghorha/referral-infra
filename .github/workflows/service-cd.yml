# Reusable CD for ghorha referral Java services.
# Builds the service repo (not referral-infra), pushes linux/arm64 to GHCR, helms to Phoenix OKE.
name: service-cd

on:
  workflow_call:
    inputs:
      service:
        description: Service repo / image name (e.g. referral-auth-service)
        required: true
        type: string
      port:
        description: Container / service port
        required: true
        type: number
    secrets:
      GH_PAT:
        required: true
      OCI_CLI_USER:
        required: true
      OCI_CLI_TENANCY:
        required: true
      OCI_CLI_FINGERPRINT:
        required: true
      OCI_CLI_KEY_CONTENT:
        required: true
      OCI_CLI_REGION:
        required: true
      OKE_CLUSTER_OCID:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout service repo
        uses: actions/checkout@v4
        with:
          repository: ghorha/${{ inputs.service }}
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build bootJar
        run: |
          # CD deploys artifacts; several service test suites are currently stale
          # (Mockito strict stubbing / WIP entity renames). Keep unit tests in
          # per-repo CI; do not block image publish on them here.
          if [ -x ./gradlew ]; then
            ./gradlew bootJar --no-daemon -x test
          else
            gradle bootJar --no-daemon -x test
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: abhaysingh197
          password: ${{ secrets.GH_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/ghorha/${{ inputs.service }}:${{ github.sha }}
            ghcr.io/ghorha/${{ inputs.service }}:latest

      - name: Configure kubeconfig for OKE
        env:
          OKE_CLUSTER_OCID: ${{ secrets.OKE_CLUSTER_OCID }}
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
        run: |
          set -euo pipefail
          if ! command -v oci >/dev/null 2>&1; then
            curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh               | bash -s -- --accept-all-defaults
            echo "${HOME}/bin" >> "$GITHUB_PATH"
          fi
          # Prefer already-configured GHORHA profile on the self-hosted Mac runner.
          if grep -q '^\[GHORHA\]' "${HOME}/.oci/config" 2>/dev/null; then
            export OCI_CLI_PROFILE=GHORHA
          else
            test -n "${OCI_CLI_USER}"
            test -n "${OCI_CLI_TENANCY}"
            test -n "${OCI_CLI_FINGERPRINT}"
            test -n "${OCI_CLI_KEY_CONTENT}"
            test -n "${OCI_CLI_REGION}"
            mkdir -p "${HOME}/.oci"
            printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "${HOME}/.oci/oci_api_key.pem"
            printf 'OCI_API_KEY\n' >> "${HOME}/.oci/oci_api_key.pem"
            chmod 600 "${HOME}/.oci/oci_api_key.pem"
            {
              echo "[DEFAULT]"
              echo "user=${OCI_CLI_USER}"
              echo "fingerprint=${OCI_CLI_FINGERPRINT}"
              echo "tenancy=${OCI_CLI_TENANCY}"
              echo "region=${OCI_CLI_REGION}"
              echo "key_file=${HOME}/.oci/oci_api_key.pem"
            } > "${HOME}/.oci/config"
            chmod 600 "${HOME}/.oci/config"
          fi
          test -n "${OKE_CLUSTER_OCID}"
          mkdir -p "${HOME}/.kube"
          oci ce cluster create-kubeconfig             --cluster-id "$OKE_CLUSTER_OCID"             --region "${OCI_CLI_REGION:-us-phoenix-1}"             --file "${HOME}/.kube/config"             --token-version 2.0.0             --kube-endpoint PUBLIC_ENDPOINT

      - name: Checkout referral-infra (Helm chart + values)
        uses: actions/checkout@v4
        with:
          repository: ghorha/referral-infra
          ref: main
          path: infra
          token: ${{ secrets.GH_PAT }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm upgrade
        env:
          SERVICE: ${{ inputs.service }}
          PORT: ${{ inputs.port }}
          SHA: ${{ github.sha }}
        run: |
          # Cluster uses private GHCR + imagePullSecret ghcr-pull (see bootstrap).
          helm upgrade --install "${SERVICE}" ./infra/deploy/chart \
            -n referral --create-namespace \
            -f "./infra/deploy/values/${SERVICE}.yaml" \
            --set image.registry=ghcr.io/ghorha \
            --set image.tag="${SHA}" \
            --set port="${PORT}" \
            --set 'imagePullSecrets[0].name=ghcr-pull' \
            --wait --timeout 10m
