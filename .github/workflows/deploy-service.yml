# Deploy a single Java service. Prefer calling this from service repos
# (they only need GH_PAT); OCI secrets live on referral-infra.
name: deploy-service
on:
  workflow_dispatch:
    inputs:
      service:
        description: e.g. referral-auth-service
        required: true
        type: string
      port:
        description: Container port
        required: true
        type: string
      ref:
        description: Git ref/SHA of the service repo to build
        required: false
        default: main
        type: string

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: ./.github/workflows/service-cd.yml
    with:
      service: ${{ inputs.service }}
      port: ${{ fromJSON(inputs.port) }}
      ref: ${{ inputs.ref }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      OKE_CLUSTER_OCID: ${{ secrets.OKE_CLUSTER_OCID }}

  # After a successful rollout (service-cd waits for `helm --wait`, so the new
  # pod is Ready here), kick off the live regression against the frontend. It
  # records the result into referral-tests/execution-history (the dashboard).
  post-deploy-regression:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    # Never let a dispatch hiccup mask a successful deploy — the rollout already
    # succeeded by the time this runs.
    continue-on-error: true
    steps:
      - name: Trigger referral-tests regression
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL || 'https://referral-frontend-ten.vercel.app' }}
        run: |
          set -euo pipefail
          gh workflow run regression.yml \
            --repo ghorha/referral-tests \
            -f base_url="${FRONTEND_BASE_URL}" \
            -f live_backend=true \
            -f record=true
          echo "Dispatched referral-tests regression against ${FRONTEND_BASE_URL}"
