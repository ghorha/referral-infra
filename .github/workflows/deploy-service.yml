# Deploy a single Java service. Prefer calling this from service repos
# (they only need GH_PAT); OCI secrets live on referral-infra.
name: deploy-service
on:
  workflow_dispatch:
    inputs:
      service:
        description: e.g. referral-auth-service
        required: true
        type: string
      port:
        description: Container port
        required: true
        type: string
      ref:
        description: Git ref/SHA of the service repo to build
        required: false
        default: main
        type: string

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: ./.github/workflows/service-cd.yml
    with:
      service: ${{ inputs.service }}
      port: ${{ fromJSON(inputs.port) }}
      ref: ${{ inputs.ref }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      OKE_CLUSTER_OCID: ${{ secrets.OKE_CLUSTER_OCID }}
