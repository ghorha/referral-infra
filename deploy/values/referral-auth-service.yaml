image:
  repository: referral-auth-service
port: 8081
replicas: 1
hpa:
  enabled: false
pdb:
  enabled: false
env:
  SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
  SPRING_PROFILES_ACTIVE: "staging"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
  SERVER_PORT: "8081"
  # referral-ai-service for the identity "360 view" embeddings (fail-soft:
  # deterministic dedup still runs if it's unreachable).
  AI_SERVICE_URL: "http://referral-ai-service:8092"
  # Shared flyway_schema_history: sibling-owned migrations (e.g. claim's V12) are
  # absent from auth's classpath, so Flyway validate crashes on restart. Skip the
  # pre-migration validation (migrations still apply). Bulletproof across Flyway
  # versions, unlike ignore-migration-patterns. Runtime override for the built image.
  SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
envFrom:
  - referral-mailgun
  - referral-db
  - referral-redis
  - referral-jwt
