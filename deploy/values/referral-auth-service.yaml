image:
  repository: referral-auth-service
port: 8081
replicas: 1
hpa:
  enabled: false
pdb:
  enabled: false
env:
  SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
  SPRING_PROFILES_ACTIVE: "staging"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
  SERVER_PORT: "8081"
  # referral-ai-service for the identity "360 view" embeddings (fail-soft:
  # deterministic dedup still runs if it's unreachable).
  AI_SERVICE_URL: "http://referral-ai-service:8092"
  # Shared flyway_schema_history: tolerate sibling-owned migrations (e.g. claim's
  # V12) absent from auth's classpath, else Flyway validate crashes on restart.
  # Runtime override so it applies even to the already-built image.
  SPRING_FLYWAY_IGNORE_MIGRATION_PATTERNS: "*:missing"
envFrom:
  - referral-mailgun
  - referral-db
  - referral-redis
  - referral-jwt
