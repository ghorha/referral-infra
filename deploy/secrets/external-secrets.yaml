# ============================================================================
# NOT APPLIED ON THE CURRENT (Phoenix / us-phoenix-1) CLUSTER.
# ----------------------------------------------------------------------------
# The live cluster provisions secrets DIRECTLY via kubectl (see
# deploy/scripts/create-db-secret.sh, create-ai-secret.sh, and deploy/README.md
# § Secrets) — NOT via OCI Vault / External Secrets. This manifest is a
# Chicago-era (us-chicago-1) artifact kept for reference / possible future use.
#
# Before ever applying it you MUST update `region` and the `vault` OCID below to
# a real Phoenix vault (the values here point at a us-chicago-1 vault that this
# cluster cannot reach), install ESO, and create the vault secret placeholders.
# ============================================================================
#
# External Secrets Operator wiring: pull app credentials from OCI Vault into Kubernetes Secrets that
# the services consume via `envFrom`. Real values live ONLY in OCI Vault (set them in the console);
# nothing sensitive is in this file. See README.md for the full flow.
#
# Prereqs: ESO installed (README step 2) + the Vault from terraform/vault.tf (README step 1).
# Fill the two REPLACE_ME below from `terraform output app_vault_ocid` and your region.
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: oci-vault
spec:
  provider:
    oracle:
      # STALE: this is a us-chicago-1 vault; the live cluster is us-phoenix-1.
      # Update both before applying (see banner above).
      region: us-chicago-1 # e.g. us-ashburn-1  (matches terraform var.region)
      vault: ocid1.vault.oc1.us-chicago-1.ijvg2n2aaaevk.abxxeljr6wtczietxgequgr3yo2ghszrhy5oiu5dzn2orycaiksl63g42adq # ocid1.vault.oc1...  (terraform output app_vault_ocid)
      # OKE nodes auth to OCI by instance principal — no static keys, covered by the Vault policy.
      principalType: InstancePrincipal
---
# Twilio (SMS) -> Kubernetes Secret `fs-twilio`
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fs-twilio
  namespace: referral
spec:
  refreshInterval: 1h
  secretStoreRef: { name: oci-vault, kind: ClusterSecretStore }
  target:
    name: fs-twilio
    creationPolicy: Owner
  data:
    - {
        secretKey: TWILIO_ACCOUNT_SID,
        remoteRef: { key: fs-twilio-account-sid },
      }
    - {
        secretKey: TWILIO_API_KEY_SID,
        remoteRef: { key: fs-twilio-api-key-sid },
      }
    - {
        secretKey: TWILIO_API_KEY_SECRET,
        remoteRef: { key: fs-twilio-api-key-secret },
      }
    - {
        secretKey: TWILIO_FROM_NUMBER,
        remoteRef: { key: fs-twilio-from-number },
      }
---
# Transactional email (dreamlit / SMTP) -> Kubernetes Secret `fs-email`
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fs-email
  namespace: referral
spec:
  refreshInterval: 1h
  secretStoreRef: { name: oci-vault, kind: ClusterSecretStore }
  target:
    name: fs-email
    creationPolicy: Owner
  data:
    - { secretKey: EMAIL_PROVIDER, remoteRef: { key: fs-email-provider } }
    - { secretKey: EMAIL_API_BASE, remoteRef: { key: fs-email-api-base } }
    - { secretKey: EMAIL_API_KEY, remoteRef: { key: fs-email-api-key } }
    - { secretKey: EMAIL_FROM, remoteRef: { key: fs-email-from } }
---
# AI provider keys -> Kubernetes Secret `fs-ai-keys` (consumed by fs-ai via envFrom).
# Create these entries in OCI Vault (console): fs-ai-openai-api-key, fs-ai-anthropic-api-key,
# fs-ai-gemini-api-key. Add more providers (DeepSeek/Kimi/your own) the same way + a data row here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fs-ai-keys
  namespace: referral
spec:
  refreshInterval: 1h
  secretStoreRef: { name: oci-vault, kind: ClusterSecretStore }
  target:
    name: fs-ai-keys
    creationPolicy: Owner
  data:
    - { secretKey: OPENAI_API_KEY, remoteRef: { key: fs-ai-openai-api-key } }
    - {
        secretKey: ANTHROPIC_API_KEY,
        remoteRef: { key: fs-ai-anthropic-api-key },
      }
    - { secretKey: GEMINI_API_KEY, remoteRef: { key: fs-ai-gemini-api-key } }
---
# PHI envelope-encryption master key -> Kubernetes Secret `fs-health-keys` (fs-health via envFrom).
# Create in OCI Vault (console): fs-health-master-key = base64 of 32 random bytes (`openssl rand -base64 32`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fs-health-keys
  namespace: referral
spec:
  refreshInterval: 1h
  secretStoreRef: { name: oci-vault, kind: ClusterSecretStore }
  target:
    name: fs-health-keys
    creationPolicy: Owner
  data:
    - { secretKey: HEALTH_MASTER_KEY, remoteRef: { key: fs-health-master-key } }
---
# Service-to-service internal-auth key -> Kubernetes Secret `referral-internal-auth`, consumed via `envFrom` by
# every service that exposes or calls a /internal/* endpoint (security review C1/C3/H3). The gateway already
# 403s external /api/*/internal/*; this gates the in-cluster hop so a rogue pod/SSRF can't call /internal
# unauthenticated (e.g. mint an impersonation token). Create in OCI Vault (console/CLI):
# fs-internal-api-key = base64url of 32 random bytes (`openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n'`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: referral-internal-auth
  namespace: referral
spec:
  refreshInterval: 1h
  secretStoreRef: { name: oci-vault, kind: ClusterSecretStore }
  target:
    name: referral-internal-auth
    creationPolicy: Owner
  data:
    - { secretKey: INTERNAL_API_KEY, remoteRef: { key: fs-internal-api-key } }
