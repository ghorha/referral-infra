---
# Database Secret
apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: production
type: Opaque
stringData:
  username: referral_user
  password: CHANGE_ME_IN_PRODUCTION
  host: referral-marketplace-postgres.xxxxx.us-east-1.rds.amazonaws.com
  port: "5432"
  database: referral_marketplace

---
# JWT Secret
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: production
type: Opaque
stringData:
  secret: CHANGE_ME_256_BIT_SECRET_KEY

---
# Stripe Secret
apiVersion: v1
kind: Secret
metadata:
  name: stripe-secret
  namespace: production
type: Opaque
stringData:
  api-key: sk_live_YOUR_KEY_HERE
  webhook-secret: whsec_YOUR_SECRET_HERE

---
# Mailgun Secret
apiVersion: v1
kind: Secret
metadata:
  name: mailgun-secret
  namespace: production
type: Opaque
stringData:
  api-key: YOUR_MAILGUN_API_KEY
  domain: mg.referralmarketplace.com
  from: noreply@referralmarketplace.com

---
# Redis Secret (if using ElastiCache with auth)
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: production
type: Opaque
stringData:
  password: ""  # Leave empty if no auth

---
# AWS S3 Credentials (for IRSA, this might not be needed)
apiVersion: v1
kind: Secret
metadata:
  name: aws-s3-secret
  namespace: production
type: Opaque
stringData:
  bucket: referral-marketplace-files-production
  region: us-east-1

---
# Google Vision API Credentials
apiVersion: v1
kind: Secret
metadata:
  name: google-vision-secret
  namespace: production
type: Opaque
stringData:
  credentials.json: |
    {
      "type": "service_account",
      "project_id": "your-project-id",
      "private_key_id": "...",
      "private_key": "...",
      "client_email": "...",
      "client_id": "...",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token"
    }

