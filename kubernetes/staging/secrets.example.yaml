# ============================================================================
# Kubernetes Secrets - Staging Environment
# ============================================================================
# Production-like but with test credentials
# ============================================================================

---
# Database Secret (from Terraform output)
apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: staging
type: Opaque
stringData:
  username: referral_user
  password: staging_password_from_secrets_manager
  host: referral-marketplace-staging.xxxxx.us-east-1.rds.amazonaws.com
  port: "5432"
  database: referral_marketplace

---
# JWT Secret (staging key - different from production)
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: staging
type: Opaque
stringData:
  secret: staging-jwt-secret-key-256-bit-different-from-prod

---
# Stripe Secret (test mode keys)
apiVersion: v1
kind: Secret
metadata:
  name: stripe-secret
  namespace: staging
type: Opaque
stringData:
  api-key: sk_test_staging_key_here
  webhook-secret: whsec_test_staging_secret_here

---
# Mailgun Secret (test mode with real delivery)
apiVersion: v1
kind: Secret
metadata:
  name: mailgun-secret
  namespace: staging
type: Opaque
stringData:
  api-key: staging-mailgun-api-key
  domain: staging.referralmarketplace.com
  from: noreply@staging.referralmarketplace.com

---
# Redis Secret
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: staging
type: Opaque
stringData:
  password: ""  # ElastiCache might require auth in staging

---
# AWS S3 Secret
apiVersion: v1
kind: Secret
metadata:
  name: aws-s3-secret
  namespace: staging
type: Opaque
stringData:
  bucket: referral-marketplace-files-staging
  region: us-east-1

---
# Google Vision API Secret (real credentials for testing)
apiVersion: v1
kind: Secret
metadata:
  name: google-vision-secret
  namespace: staging
type: Opaque
stringData:
  credentials.json: |
    {
      "type": "service_account",
      "project_id": "your-staging-project",
      "private_key_id": "...",
      "private_key": "...",
      "client_email": "...",
      "client_id": "...",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token"
    }

