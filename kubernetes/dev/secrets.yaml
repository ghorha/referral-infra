# ============================================================================
# Kubernetes Secrets - Development Environment
# ============================================================================
# These are simplified secrets for development
# In production, use AWS Secrets Manager or External Secrets Operator
# ============================================================================

---
# Database Secret (from Terraform output)
apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: dev
type: Opaque
stringData:
  username: referral_user
  password: dev_password
  host: referral-marketplace-dev.xxxxx.us-east-1.rds.amazonaws.com
  port: "5432"
  database: referral_marketplace

---
# JWT Secret (dev key - not secure)
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: dev
type: Opaque
stringData:
  secret: dev-jwt-secret-key-not-for-production-use-only

---
# Stripe Secret (test mode keys)
apiVersion: v1
kind: Secret
metadata:
  name: stripe-secret
  namespace: dev
type: Opaque
stringData:
  api-key: sk_test_dev_key_here
  webhook-secret: whsec_test_secret_here

---
# Mailgun Secret (test mode)
apiVersion: v1
kind: Secret
metadata:
  name: mailgun-secret
  namespace: dev
type: Opaque
stringData:
  api-key: dev-mailgun-key-or-empty-for-mock
  domain: dev.referralmarketplace.com
  from: noreply@dev.referralmarketplace.com

---
# Redis Secret
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: dev
type: Opaque
stringData:
  password: ""  # No auth in dev Redis

---
# AWS S3 Secret
apiVersion: v1
kind: Secret
metadata:
  name: aws-s3-secret
  namespace: dev
type: Opaque
stringData:
  bucket: referral-marketplace-files-dev
  region: us-east-1

---
# Google Vision API Secret (can be empty for dev - uses mock)
apiVersion: v1
kind: Secret
metadata:
  name: google-vision-secret
  namespace: dev
type: Opaque
stringData:
  credentials.json: |
    {}

