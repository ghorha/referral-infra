# ============================================================================
# Helm Chart Values for Referral Marketplace
# ============================================================================

# Global configuration
global:
  environment: production
  domain: referralmarketplace.com
  
  # Image registry
  imageRegistry: your-account-id.dkr.ecr.us-east-1.amazonaws.com
  imagePullPolicy: IfNotPresent
  
  # Database configuration (RDS)
  database:
    host: referral-marketplace-prod.xxxxx.us-east-1.rds.amazonaws.com
    port: 5432
    name: referral_marketplace
    username: referral_user
    # Password from secret
  
  # Redis configuration (ElastiCache)
  redis:
    host: referral-marketplace-prod.xxxxx.cache.amazonaws.com
    port: 6379
  
  # S3 configuration
  s3:
    bucket: referral-marketplace-files-production
    region: us-east-1

# API Gateway
apiGateway:
  enabled: true
  name: api-gateway
  replicaCount: 3
  
  image:
    repository: api-gateway
    tag: latest
  
  service:
    type: ClusterIP
    port: 8080
  
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# Auth Service
authService:
  enabled: true
  name: auth-service
  replicaCount: 2
  
  image:
    repository: auth-service
    tag: latest
  
  service:
    type: ClusterIP
    port: 8081
  
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  
  config:
    mailgunEnabled: true
    jwtExpiration: 86400000  # 24 hours

# Listing Service
listingService:
  enabled: true
  name: listing-service
  replicaCount: 2
  
  image:
    repository: listing-service
    tag: latest
  
  service:
