    tag: latest
  
  service:
    type: ClusterIP
    port: 8083
  
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70
  
  config:
    storageType: s3
    ocrEnabled: true

