# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  
  hosts:
    - host: api.referralmarketplace.com
      paths:
        - path: /
          pathType: Prefix
          service: api-gateway
          port: 8080
  
  tls:
    - secretName: referral-marketplace-tls
      hosts:
        - api.referralmarketplace.com

# Monitoring
monitoring:
  enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
  
  jaeger:
    enabled: true
    agent:
      host: jaeger-agent
      port: 6831

# Pod Disruption Budgets
podDisruptionBudget:
  enabled: true
  minAvailable: 1

